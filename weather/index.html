<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
    <title>Weather</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <span id="locationName" class="location-name">Loading...</span>
            <span id="tempUnit" class="temp-unit">°F</span>
        </header>

        <main id="mainContent" class="main-content">
            <!-- Current View (Default) -->
            <div id="viewCurrent" class="view active">
                <div class="current-temp-box">
                    <span id="currentIcon" class="weather-icon">⛅</span>
                    <span id="currentTemp" class="current-temp">--°</span>
                </div>
                <div id="currentCondition" class="condition-text">Fetching forecast</div>
                <div class="details-row">
                    <span id="detailHumidity">H: --%</span>
                    <span id="detailWind">W: -- mph</span>
                </div>
            </div>

            <!-- Hourly View -->
            <div id="viewHourly" class="view">
                <div class="view-title">Hourly Forecast</div>
                <div id="hourlyList" class="hourly-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Daily View -->
            <div id="viewDaily" class="view">
                <div class="view-title">7-Day Forecast</div>
                <div id="dailyList" class="daily-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
            <p id="hint" class="hint">scroll: view · side: °C/°F</p>
        </footer>
        <span id="status" class="sr-only" aria-live="polite"></span>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
