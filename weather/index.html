<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
    <title>Weather</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <span id="locationName" class="location-name">Loading...</span>
            <span id="tempUnit" class="temp-unit">°F</span>
        </header>

        <main id="mainContent" class="main-content">
            <!-- Current View (Default) -->
            <div id="viewCurrent" class="view active">
                <div class="current-temp-box">
                    <span id="currentIcon" class="weather-icon">⛅</span>
                    <span id="currentTemp" class="current-temp">--°</span>
                </div>
                <div id="currentCondition" class="condition-text">Fetching forecast</div>
                <div class="details-row">
                    <span id="detailHumidity">H: --%</span>
                    <span id="detailWind">W: -- mph</span>
                </div>
            </div>

            <!-- Hourly View -->
            <div id="viewHourly" class="view">
                <div class="view-title">Hourly Forecast</div>
                <div id="hourlyList" class="hourly-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Daily View -->
            <div id="viewDaily" class="view">
                <div class="view-title">5-Day Forecast</div>
                <div id="dailyList" class="daily-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Location View -->
            <div id="viewLocation" class="view location-view">
                <div class="view-title">Location</div>
                <div id="zipDisplay" class="zip-display" aria-label="ZIP code">-----</div>
                <p id="locationStatus" class="location-status"></p>
                <div id="zipPad" class="zip-pad" role="group" aria-label="ZIP digit pad">
                    <button type="button" class="pad-key" data-digit="1">1</button>
                    <button type="button" class="pad-key" data-digit="2">2</button>
                    <button type="button" class="pad-key" data-digit="3">3</button>
                    <button type="button" class="pad-key" data-digit="4">4</button>
                    <button type="button" class="pad-key" data-digit="5">5</button>
                    <button type="button" class="pad-key" data-digit="6">6</button>
                    <button type="button" class="pad-key" data-digit="7">7</button>
                    <button type="button" class="pad-key" data-digit="8">8</button>
                    <button type="button" class="pad-key" data-digit="9">9</button>
                    <button type="button" class="pad-key pad-back" data-action="back" aria-label="Backspace">⌫</button>
                    <button type="button" class="pad-key" data-digit="0">0</button>
                    <button type="button" class="pad-key pad-set" data-action="set">Set</button>
                </div>
                <div id="browserCityRow" class="browser-city-row hidden">
                    <input type="text" id="cityInput" class="location-input" placeholder="City name" autocomplete="off" enterkeyhint="go">
                    <button type="button" id="citySetBtn" class="city-set-btn">Go</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
            </div>
            <p id="hint" class="hint">scroll: view · side: °C/°F</p>
        </footer>
        <span id="status" class="sr-only" aria-live="polite"></span>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
